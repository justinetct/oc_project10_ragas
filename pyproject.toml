[tool.poetry]
# Projet applicatif (pas une librairie) : on n'installe pas le projet lui-même,
# seulement ses dépendances.
name = "oc-project10-ragas"
version = "0.1.0"
description = "Projet 10 OpenClassrooms — Évaluez les performances d'un LLM (assistant RAG NBA avec Mistral)"
authors = ["Projet 10 OpenClassrooms"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# --- Application RAG / Streamlit ---
streamlit = "^1.44"
python-dotenv = "^1.0"
mistralai = "^1.0"            # SDK Mistral récent (remplace l'ancien 0.4.2)
faiss-cpu = "^1.10"
langchain = "^0.3"
langchain-core = "^0.3"
pydantic = "^2.0"

# --- Chargement / parsing des documents ---
pandas = "^2.2"
openpyxl = "^3.1"
pillow = ">=11,<13"
pymupdf = "^1.24"
pypdf2 = "^3.0"
python-docx = "^1.1"
requests = "^2.32"
tqdm = "^4.67"
numpy = ">=1.26"

# --- OCR ---
# Deux moteurs OCR, sélectionnables (OCR_ENGINE) pour comparer le taux de reconnaissance :
#   - easyocr  : moteur historique du prototype (rapide, léger) ;
#   - nanonets : Nanonets-OCR-s (VLM Qwen2.5-VL via transformers, voir lignes plus bas),
#     moteur OCR alternatif évalué (opt-in).
easyocr = "^1.7"             # moteur OCR historique (utils/data_loader.py)
pytesseract = "^0.3"         # prévu pour la suite (non utilisé dans le code pour l'instant)

# --- Évaluation RAGAS (utilisées par scripts/evaluate_ragas.py) ---
ragas = "^0.4"                 # épinglé : on garde l'API classique evaluate() (stable en 0.4.x)
langchain-mistralai = "^0.2"   # branche Mistral (LLM + embeddings) sur RAGAS
# --- Observabilité : traçage Logfire des étapes clés du pipeline ---
logfire = "*"
# --- Génération structurée : agent RAG à sortie typée (Pydantic AI) ---
pydantic-ai-slim = {version = "<1.0", extras = ["mistral"]}
# --- OCR Nanonets-OCR-s (moteur OCR VLM alternatif, opt-in) ---
transformers = ">=4.49,<5"      # exécute le VLM Nanonets-OCR-s (Qwen2.5-VL) en local
accelerate = "^1.14.0"       # chargement / placement device du modèle
# --- Visualisations (PlotTool optionnel : utils/plotting) ---
# Dépendance applicative (et non plus seulement « notebook ») : le PlotTool optionnel génère
# les graphiques bar/scatter/pie de l'assistant. Sert aussi au notebook d'illustration RAGAS.
matplotlib = "^3.10.9"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
ruff = ">=0.6"
ipykernel = "^7.0"           # pour exécuter le notebook depuis l'environnement Poetry

# ─── Qualité de code ───────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120
# On ne lint pas les dossiers locaux / artefacts ni le notebook (détails fragiles).
extend-exclude = [".venv", "vector_db", "database", "notebooks", ".ipynb_checkpoints"]

[tool.ruff.lint]
# Jeu de règles volontairement simple (niveau prototype) :
#   F = pyflakes (imports inutilisés, noms non définis…), E/W = style pycodestyle.
select = ["E", "F", "W"]
ignore = ["E501"]  # longueur de ligne tolérée sur ce prototype

[tool.ruff.lint.per-file-ignores]
# scripts/evaluate_ragas.py fixe KMP_DUPLICATE_LIB_OK (faiss/macOS), le sys.path et
# filtre un warning de dépréciation RAGAS AVANT d'importer faiss/ragas : E402 toléré.
"scripts/evaluate_ragas.py" = ["E402"]
# scripts/analyze_llm_sql_generation.py fixe KMP_DUPLICATE_LIB_OK et le sys.path avant
# ses imports (lancement direct du script) : E402 toléré, comme l'évaluation RAGAS.
"scripts/analyze_llm_sql_generation.py" = ["E402"]
# scripts/compare_sql_modes_extended.py : même motif (sys.path avant imports).
"scripts/compare_sql_modes_extended.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# On masque trois DeprecationWarning internes à OpenTelemetry (dépendance
# transitive de Logfire) : elles concernent du code tiers, pas le nôtre.
# On masque aussi l'avertissement RAGAS sur le chemin d'import des métriques
# (ragas.metrics -> ragas.metrics.collections en v1.0) : on est épinglé en 0.4.x.
filterwarnings = [
    "ignore:You should use `Logger` instead:DeprecationWarning",
    "ignore:You should use `LoggerProvider` instead:DeprecationWarning",
    "ignore:You should use `ProxyLoggerProvider` instead:DeprecationWarning",
    "ignore:Importing .* from 'ragas.metrics' is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning:PyPDF2.*",
]

[tool.logfire]
# Logfire est optionnel et non bloquant : sans configuration (pas de token), on reste en
# mode local silencieux. On supprime l'avertissement "non configuré" émis sinon dès le
# premier span hors application (ex. requete_sql, recherche_vectorielle, en tests/scripts).
ignore_no_config = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
